[package]
name = "logger"
version = "0.1.0"
edition = "2024"

[dependencies]
time = { version = "0.3.47", features = ["formatting", "macros"] }
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "local-time"] }

[lib]
name = "logger"
path = "src/lib.rs"

